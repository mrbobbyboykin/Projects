# Run playbooks from Control-Node as your Ansible control host.
# Replace ansible_host values with your lab IPs (static or DHCP reservations).

[webservers]
App-Node ansible_host=192.168.56.101 ansible_user=ansible
# Uncomment when you add clones / extra VMs for the 3-node demo:
# App-Node-02 ansible_host=192.168.56.102 ansible_user=ansible
# App-Node-03 ansible_host=192.168.56.103 ansible_user=ansible

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
