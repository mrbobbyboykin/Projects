---
- name: Validate web_stack selection
  ansible.builtin.assert:
    that:
      - web_stack in ['nginx', 'httpd']
    fail_msg: "web_stack must be 'nginx' or 'httpd' (got {{ web_stack }})"

- name: Install web server packages
  ansible.builtin.package:
    name: "{{ nginx_packages if web_stack == 'nginx' else httpd_packages }}"
    state: present

- name: Ensure firewalld is installed and enabled
  ansible.builtin.package:
    name: firewalld
    state: present

- name: Enable and start firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Open HTTP/HTTPS in firewalld
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ web_firewall_services }}"

- name: Deploy architecture diagram (nginx docroot)
  ansible.builtin.copy:
    src: "{{ lab_architecture_src }}"
    dest: "{{ web_docroot_nginx }}/{{ lab_architecture_filename }}"
    owner: root
    group: root
    mode: "0644"
  when: web_stack == 'nginx'

- name: Deploy index page (nginx docroot)
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ web_docroot_nginx }}/index.html"
    owner: root
    group: root
    mode: "0644"
  when: web_stack == 'nginx'
  notify: Reload nginx

- name: Deploy architecture diagram (httpd docroot)
  ansible.builtin.copy:
    src: "{{ lab_architecture_src }}"
    dest: "{{ web_docroot_httpd }}/{{ lab_architecture_filename }}"
    owner: root
    group: root
    mode: "0644"
  when: web_stack == 'httpd'

- name: Deploy index page (httpd docroot)
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ web_docroot_httpd }}/index.html"
    owner: root
    group: root
    mode: "0644"
  when: web_stack == 'httpd'
  notify: Reload httpd

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  when: web_stack == 'nginx'

- name: Enable and start httpd
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true
  when: web_stack == 'httpd'
