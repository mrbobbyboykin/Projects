# Run playbooks from Control-Node as your Ansible control host.
# Replace ansible_host values with your lab IPs (static or DHCP reservations).

[webservers]
App-Node1 ansible_host=192.168.1.160 ansible_user=ansible
App-Node2 ansible_host=192.168.1.161 ansible_user=ansible

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=/home/vboxadmin/.ssh/id_ed25519_lab