<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bobby Boykin — Linux / Cloud portfolio lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="hero">
      <p class="brand">Built by Bobby Boykin — Linux / Cloud portfolio lab</p>
      <h1>Fast, simple, and cloud-native.</h1>
      <p class="lede">
        This page is hosted on S3, served through CloudFront, and tracks visits with DynamoDB. Updates ship through a GitHub-triggered AWS CodePipeline that builds and deploys with CodeBuild.
      </p>
      <div class="cta">
        <button type="button" id="count-btn">Count this visit</button>
        <p class="count-line" id="count-line" aria-live="polite">Visits: —</p>
      </div>
      <p class="links">
        <a href="https://github.com/mrbobbyboykin/Projects" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span class="link-sep" aria-hidden="true">·</span>
        <a href="https://www.linkedin.com/in/bobbyboykin" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
