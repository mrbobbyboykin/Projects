name: Project 6 — Build, Scan, Deploy

on:
  push:
    branches: [main]
    paths:
      - "project-6-secure-containers/app/**"
      - ".github/workflows/project6-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: project6-api
  ECS_CLUSTER: project6-lab
  ECS_SERVICE: project6-lab-api
  IMAGE_TAG: latest

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-6-secure-containers/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROJECT6 }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .

      - name: Trivy scan (warn-only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "0"          # warn-only: never fail the job
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Push image to ECR
        run: docker push "$IMAGE"

      - name: Deploy to ECS (force new deployment)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
