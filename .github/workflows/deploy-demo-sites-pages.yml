name: Deploy demo sites to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Demo Site SaxtonsGlazingLLC/**"
      - "Demo Site ElainaB/**"
      - ".github/workflows/deploy-demo-sites-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-sites-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp -r "Demo Site SaxtonsGlazingLLC" _site/
          cp -r "Demo Site ElainaB" _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
