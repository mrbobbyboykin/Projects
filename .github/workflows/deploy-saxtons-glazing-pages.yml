name: Deploy Saxtons Glazing preview

on:
  push:
    branches: [main]
    paths:
      - "Template Sites/SaxtonsGlazingLLC/**"
      - ".github/workflows/deploy-saxtons-glazing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saxtons-glazing-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Template Sites/SaxtonsGlazingLLC

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
